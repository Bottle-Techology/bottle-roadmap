<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottle Technology — Product Portfolio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#eceae6;--bg4:#f0eff0;
  --text:#111;--text2:#555;--text3:#999;--text4:#c0bfba;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --green:#3B6D11;--green-bg:#EAF3DE;
  --amber:#7A5200;--amber-bg:#FFF3CD;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --gray:#4A4945;--gray-bg:#F1EFE8;
  --purple:#3E3596;--purple-bg:#EEEDFE;
  --teal:#0C5E45;--teal-bg:#E1F5EE;
  --pink:#7A2445;--pink-bg:#FBEAF0;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,monospace;
}
body{font-family:var(--font);background:var(--bg4);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;color-scheme:light}

/* ══ TOP NAV ══ */
.topnav{flex:0 0 52px;height:52px;background:#fff;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;z-index:50}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.nav-dot{width:9px;height:9px;border-radius:50%;background:#185FA5}
.nav-divider{width:1px;height:18px;background:var(--border2)}
.nav-title{font-size:13px;font-weight:500;color:#333}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-meta{font-size:11px;color:var(--text3)}

/* ══ TABS ══ */
.tabnav{flex:0 0 auto;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--border2);padding:0 20px;gap:2px}
.tab{padding:12px 20px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;user-select:none;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.tab-badge{background:var(--bg3);color:var(--text2);font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.tab.active .tab-badge{background:var(--text);color:#fff}

/* ══ CONTENT ══ */
.content{flex:1 1 0;overflow:auto;background:var(--bg4);padding:0}
.pane{display:none;padding:20px 24px 60px;max-width:1600px;margin:0 auto}
.pane.active{display:block}
.pane-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding-bottom:12px;border-bottom:1px solid var(--border2)}
.pane-title{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.pane-sub{font-size:11px;color:var(--text3)}
.pane-lead{font-size:12px;color:var(--text2);margin-top:10px;margin-bottom:20px;max-width:800px;line-height:1.5}

.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin:24px 0 10px}

/* ══ CARDS ══ */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--border2);border-radius:8px;padding:14px 16px}
.card-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.card-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.card-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* Health cards */
.health-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.hcard{background:#fff;border:1px solid var(--border2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.hcard-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.hcard-num{font-size:28px;font-weight:800;line-height:1}
.hcard.g .hcard-num{color:var(--green)}
.hcard.a .hcard-num{color:var(--amber)}
.hcard.r .hcard-num{color:var(--red)}
.hcard-tag{font-size:10px;color:var(--text3)}

/* Indicators list */
.indicators{background:#fff;border:1px solid var(--border2);border-radius:8px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ind-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:5px 0}
.ind-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ind-dot.g{background:var(--green)}
.ind-dot.a{background:var(--amber)}
.ind-dot.r{background:var(--red)}
.ind-dot.b{background:var(--blue)}

/* Tables */
.data-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border2);border-radius:8px;overflow:hidden;font-size:12px}
.data-table thead th{background:var(--bg2);text-align:left;padding:10px 12px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border2);white-space:nowrap}
.data-table tbody td{padding:10px 12px;border-bottom:0.5px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--bg2)}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.data-table td.center{text-align:center}
.data-table td.strong{font-weight:600;color:var(--text)}
.data-table td.muted{color:var(--text3);font-size:11px}

/* Health pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.pill-g{background:var(--green-bg);color:var(--green)}
.pill-a{background:var(--amber-bg);color:var(--amber)}
.pill-r{background:var(--red-bg);color:var(--red)}
.pill-b{background:var(--blue-bg);color:var(--blue)}
.pill-p{background:var(--purple-bg);color:var(--purple)}
.pill-gray{background:var(--gray-bg);color:var(--gray)}
.pill-teal{background:var(--teal-bg);color:var(--teal)}
.pill-pink{background:var(--pink-bg);color:var(--pink)}
.pill-w{background:#333;color:#fff}

/* Progress bar */
.pbar{width:100%;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:3px}
.pbar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.pbar-fill.a{background:var(--amber)}
.pbar-fill.r{background:var(--red)}

/* ══ PORTFOLIO CARDS ══ */
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--border2);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.pcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.pcard-obj{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px}
.pcard-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:11px}
.pcard-meta .k{color:var(--text3);font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:0.05em;margin-bottom:1px}
.pcard-meta .v{color:var(--text);font-weight:500}
.pcard-section{border-top:0.5px solid var(--border);padding-top:10px}
.pcard-section-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.pcard-list{list-style:none;padding:0;margin:0;font-size:11px;color:var(--text2);line-height:1.6}
.pcard-list li{padding:2px 0;display:flex;gap:6px;align-items:flex-start}
.pcard-list li::before{content:'•';color:var(--text3);flex-shrink:0}
.pcard-owners{display:flex;flex-wrap:wrap;gap:4px}
.opill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px 2px 3px;font-size:10px;font-weight:500;white-space:nowrap}
.oa{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}

/* ══ HR GRID ══ */
.hr-grid{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--border2);border-radius:8px;font-size:11px}
.hr-grid thead th{background:var(--bg2);text-align:center;padding:8px 6px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border2);border-right:0.5px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5;box-shadow:inset 0 -1px 0 var(--border2)}
.hr-grid thead th.person-h{text-align:left;padding-left:14px;position:sticky;left:0;z-index:7;box-shadow:inset -1px -1px 0 var(--border2)}
.hr-grid thead th.project-h{text-align:left;padding-left:10px;position:sticky;left:170px;z-index:7;box-shadow:inset -1px -1px 0 var(--border2)}
.hr-grid tbody td{padding:6px 6px;border-bottom:0.5px solid var(--border);border-right:0.5px solid var(--border);text-align:center;font-variant-numeric:tabular-nums;background:#fff}
.hr-grid tbody td.person-c{text-align:left;padding-left:14px;font-weight:600;position:sticky;left:0;background:#fff;z-index:2;box-shadow:inset -1px 0 0 var(--border2)}
.hr-grid tbody td.project-c{text-align:left;padding-left:10px;color:var(--text2);position:sticky;left:170px;background:#fff;z-index:2;box-shadow:inset -1px 0 0 var(--border2)}
.hr-grid tbody tr:hover td{background:var(--bg2)}
.hr-grid tbody tr:hover td.person-c,.hr-grid tbody tr:hover td.project-c{background:var(--bg2)}
.hr-grid td.util{font-weight:600}
.hr-grid td.util-good{background:#EAF3DE;color:#3B6D11}
.hr-grid td.util-full{background:#FFF3CD;color:#7A5200}
.hr-grid td.util-over{background:#FCEBEB;color:#A32D2D}
.hr-grid td.util-under{background:#F1EFE8;color:#555}
.hr-grid td.dim{color:var(--text4)}

/* HR sub-tabs */
.subtabs{display:flex;gap:2px;margin-bottom:12px}
.subtab{padding:6px 14px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:6px;border:0.5px solid var(--border2);background:#fff;transition:all .12s}
.subtab:hover{background:var(--bg2)}
.subtab.active{background:var(--text);color:#fff;border-color:var(--text)}
.subpane{display:none}
.subpane.active{display:block}

/* ══ DECISIONS / PIVOTS ══ */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--border2)}
.tevent{position:relative;margin-bottom:14px;background:#fff;border:1px solid var(--border2);border-radius:8px;padding:12px 16px}
.tevent::before{content:'';position:absolute;left:-24px;top:16px;width:12px;height:12px;background:var(--text);border-radius:50%;border:3px solid var(--bg4)}
.tevent.major::before{background:var(--red)}
.tevent-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.tevent-title{font-size:13px;font-weight:700}
.tevent-date{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}
.tevent-body{font-size:11px;color:var(--text2);line-height:1.6}

/* ══ MILESTONES ══ */
.ms-filters{display:flex;gap:6px;margin-bottom:14px}
.ms-filter{padding:5px 12px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:20px;border:0.5px solid var(--border2);background:#fff;transition:all .12s}
.ms-filter:hover{background:var(--bg2)}
.ms-filter.active{background:var(--text);color:#fff;border-color:var(--text)}

/* ══ Roadmap embed ══ */
.roadmap-frame{width:100%;height:calc(100vh - 145px);border:none;background:#fff;border-radius:0}

/* Utility */
.muted{color:var(--text3)}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.mono{font-family:var(--mono);font-size:11px}
.small{font-size:10px}
.spacer{height:12px}
.divider{height:1px;background:var(--border2);margin:20px 0}

/* Attention items */
.attn-list{display:flex;flex-direction:column;gap:8px}
.attn{background:#fff;border:1px solid var(--border2);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.attn-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:#fff}
.attn-icon.r{background:var(--red)}
.attn-icon.a{background:var(--amber)}
.attn-icon.b{background:var(--blue)}
.attn-body{flex:1;font-size:12px;color:var(--text)}
.attn-title{font-weight:600;margin-bottom:2px}
.attn-sub{font-size:11px;color:var(--text3)}

/* Two-column layouts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:960px){.two-col{grid-template-columns:1fr}}

/* ═══ ROADMAP CSS (scoped to .rm-scope) ═══ */

*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --lw:236px;
  --col:48px;
  --bg:#fff;--bg2:#f7f6f3;--bg3:#eceae6;
  --text:#111;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
body{font-family:var(--font);background:#f0eff0;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;color-scheme:light}

.rm-scope .topnav{flex:0 0 52px;height:52px;background:#fff;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;z-index:50}
.rm-scope .nav-left{display:flex;align-items:center;gap:10px}
.rm-scope .nav-logo{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.rm-scope .nav-dot{width:9px;height:9px;border-radius:50%;background:#185FA5}
.rm-scope .nav-divider{width:1px;height:18px;background:var(--border2)}
.rm-scope .nav-title{font-size:13px;font-weight:500;color:#333}
.rm-scope .nav-right{display:flex;align-items:center;gap:14px}
.rm-scope .nav-meta{font-size:11px;color:var(--text3)}
.rm-scope .nav-btn{font-size:11px;padding:5px 12px;border-radius:6px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px;transition:background .15s}
.rm-scope .nav-btn:hover{background:var(--bg3)}

.rm-scope .filterbar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--border2);padding:0 20px}
.rm-scope .filter-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.rm-scope .filter-row:last-child{border-bottom:none}
.rm-scope .filter-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;width:52px;flex-shrink:0}
.rm-scope .chip{font-size:11px;padding:3px 11px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:5px}
.rm-scope .chip:hover{background:var(--bg3);color:var(--text)}
.rm-scope .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.rm-scope .pchip{font-size:11px;padding:3px 10px 3px 4px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;font-family:var(--font);display:flex;align-items:center;gap:5px}
.rm-scope .pchip:hover{background:var(--bg3);color:var(--text)}
.rm-scope .pchip.active{border-color:#111;color:#111;box-shadow:0 0 0 1.5px #111}
.rm-scope .avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}

.rm-scope .legendbar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--border2);padding:6px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rm-scope .leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)}
.rm-scope .leg-sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.rm-scope .leg-dia{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:#C89000;flex-shrink:0}

.rm-scope .scroll-area{flex:1 1 0;overflow:auto;position:relative;background:#f0eff0}
.rm-scope .gantt{display:table;border-collapse:collapse;min-width:max-content;width:100%}

.rm-scope .gantt-hrow{display:table-row}
.rm-scope .hcorner{display:table-cell;width:var(--lw);min-width:var(--lw);position:sticky;left:0;top:0;z-index:40;background:#fff;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:0 10px 0 16px;vertical-align:middle;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.04em;text-transform:uppercase}
.rm-scope .htimeline{display:table-cell;position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border2);padding:0;vertical-align:middle;position:sticky}
.rm-scope .hcols{display:flex}
.rm-scope .hcol{flex:0 0 var(--col);width:var(--col);font-size:10px;color:var(--text3);text-align:center;padding:0 2px;border-left:0.5px solid var(--border);height:36px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:400}
.rm-scope .hcol.major{color:#111;font-weight:700}
.rm-scope .hcol.month-line{border-left:1px solid var(--border2)}
.rm-scope .today-header-marker{position:absolute;top:0;z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform:translateX(-50%)}
.rm-scope .today-badge{background:#E24B4A;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:4px}
.rm-scope .today-tick{width:2px;height:10px;background:#E24B4A;margin-top:1px}

.rm-scope .grow{display:table-row;cursor:pointer}
.rm-scope .grow .lc{background:var(--bg2);border-top:1px solid var(--border2);border-bottom:0.5px solid var(--border2)}
.rm-scope .grow .tc{background:var(--bg2);border-top:1px solid var(--border2);border-bottom:0.5px solid var(--border2)}
.rm-scope .glabel{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;display:flex;align-items:center;gap:5px;user-select:none}
.rm-scope .garr{font-size:9px;transition:transform .2s}

.rm-scope .drow{display:table-row}
.rm-scope .drow.hidden{display:none}
.rm-scope .lc{display:table-cell;width:var(--lw);min-width:var(--lw);max-width:var(--lw);position:sticky;left:0;z-index:10;background:#fff;border-right:1px solid var(--border2);border-bottom:0.5px solid var(--border);padding:9px 10px 9px 16px;vertical-align:top}
.rm-scope .row-title{font-size:12px;font-weight:700;line-height:1.3}
.rm-scope .row-sub{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4}
.rm-scope .owner-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.rm-scope .opill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 7px 2px 3px;font-size:10px;font-weight:500;white-space:nowrap}
.rm-scope .opill .oa{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}

.rm-scope .tc{display:table-cell;position:relative;border-bottom:0.5px solid var(--border);vertical-align:top;background-image:repeating-linear-gradient(to right,transparent,transparent calc(var(--col) - 0.5px),rgba(0,0,0,0.055) calc(var(--col) - 0.5px),rgba(0,0,0,0.055) var(--col))}
.rm-scope .mline{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,0.1);z-index:1;pointer-events:none}

.rm-scope .bar{position:absolute;height:22px;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;border-radius:5px;cursor:default;z-index:3;transition:filter .12s,box-shadow .12s,opacity .2s}

const NMLEN = 12;

function utilByPerson() {
  const out = {};
  PEOPLE.forEach(p => { out[p.id] = new Array(NMLEN).fill(0); });
  ENGAGEMENTS.forEach(([pid, proj, arr]) => {
    if (!out[pid]) out[pid] = new Array(NMLEN).fill(0);
    for (let i = 0; i < NMLEN; i++) out[pid][i] += arr[i];
  });
  return out;
}
function monthlyCostByPersonProject() {
  const rows = [];
  ENGAGEMENTS.forEach(([pid, proj, arr]) => {
    const person = PMAP[pid];
    if (!person) return;
    const monthly = arr.map(a => a * (person.ctc || 0));
    rows.push({pid, proj, arr, monthly, annual: monthly.reduce((a,b)=>a+b,0)});
  });
  return rows;
}
function projectMonthlyCost(projId) {
  const rows = monthlyCostByPersonProject().filter(r => r.proj === projId);
  const monthly = new Array(NMLEN).fill(0);
  rows.forEach(r => r.monthly.forEach((m,i) => { monthly[i] += m; }));
  return {monthly, annual: monthly.reduce((a,b)=>a+b,0)};
}

/* ═══════════════════════════════════════════════════════════════════
   RELEASE SCORECARDS — computations + renderers
   ═══════════════════════════════════════════════════════════════════ */

/* Feature status weights toward "scope delivered" */
const SCOPE_STATUS_WEIGHT = {
  'backlog': 0, 'ready': 0.05, 'in-dev': 0.3, 'code-complete': 0.6,
  'qa': 0.75, 'uat': 0.9, 'ready-release': 1, 'released': 1, 'blocked': 0.15
};
const DEV_STATUS_DONE = new Set(['code-complete','qa','uat','ready-release','released']);
const QA_STATUS_DONE  = new Set(['uat','ready-release','released']);
const UAT_STATUS_DONE = new Set(['ready-release','released']);

const STATUS_LABEL_R = {
  'backlog':'Backlog','ready':'Ready','in-dev':'In dev','code-complete':'Code complete',
  'qa':'QA','uat':'UAT','ready-release':'Ready for release','released':'Released','blocked':'Blocked',
};
const STATUS_PILL_R = {
  'backlog':'pill-gray','ready':'pill-b','in-dev':'pill-b','code-complete':'pill-teal',
  'qa':'pill-teal','uat':'pill-p','ready-release':'pill-g','released':'pill-g','blocked':'pill-r',
};

const PRIORITY_LABEL = {'must':'Must have','should':'Should have','could':'Could have','wont':'Won\'t (out of scope)'};
const PRIORITY_PILL = {'must':'pill-r','should':'pill-a','could':'pill-gray','wont':'pill-gray'};

const RELEASE_STATUS_PILL = {'released':'pill-g','in-progress':'pill-b','planning':'pill-a','tbd':'pill-gray'};
const RELEASE_STATUS_LABEL = {'released':'Released','in-progress':'In progress','planning':'Planning','tbd':'Scope TBD'};

const CONF_PILL = {'high':'pill-g','medium':'pill-a','low':'pill-r'};
const CONF_LABEL = {'high':'High','medium':'Medium','low':'Low'};

function computeScopePct(release) {
  if (!release.scope || !release.scope.length) return 0;
  const totalWeight = release.scope.reduce((s,f)=>s+(f.weight||0), 0);
  if (totalWeight === 0) return 0;
  const done = release.scope.reduce((s,f)=>s + (f.weight||0) * (SCOPE_STATUS_WEIGHT[f.status]||0), 0);
  return Math.round((done / totalWeight) * 100);
}
function computeDevPct(release) {
  if (!release.scope || !release.scope.length) return 0;
  const total = release.scope.length;
  const done = release.scope.filter(f => DEV_STATUS_DONE.has(f.status)).length;
  return Math.round((done / total) * 100);
}
function computeQaPct(release) {
  if (!release.scope || !release.scope.length) return 0;
  // AC pass rate
  let total = 0, passed = 0;
  release.scope.forEach(f => {
    if (f.ac) { total += f.ac.total||0; passed += f.ac.passed||0; }
  });
  if (total === 0) return 0;
  return Math.round((passed / total) * 100);
}
function computeUatPct(release) {
  if (!release.scope || !release.scope.length) return 0;
  const total = release.scope.length;
  const done = release.scope.filter(f => UAT_STATUS_DONE.has(f.status)).length;
  return Math.round((done / total) * 100);
}
function computeGatesPct(release) {
  if (!release.gates || !release.gates.length) return 0;
  const done = release.gates.filter(g => g.checked).length;
  return Math.round((done / release.gates.length) * 100);
}
function computeReadiness(release) {
  // Composite: 40% scope + 20% QA + 20% UAT + 20% gates
  return Math.round(
    computeScopePct(release) * 0.4 +
    computeQaPct(release) * 0.2 +
    computeUatPct(release) * 0.2 +
    computeGatesPct(release) * 0.2
  );
}
function readinessHealth(pct) {
  if (pct >= 90) return 'g';
  if (pct >= 60) return 'a';
  return 'r';
}
function scopeHealth(pct) {
  if (pct >= 80) return 'g';
  if (pct >= 40) return 'a';
  return 'r';
}

function releasesByProduct(pid) {
  return RELEASES.filter(r => r.product === pid);
}

/* ── RELEASES TAB ─────────────────────────────────────────── */
let releasesFilter = 'all'; // product id or 'all'
let releasesShowTBD = false;

function renderReleases() {
  const el = document.getElementById('pane-releases');
  const filtered = RELEASES.filter(r => {
    if (releasesFilter !== 'all' && r.product !== releasesFilter) return false;
    if (!releasesShowTBD && r.status === 'tbd') return false;
    return true;
  });

  // Group by product
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.product]) groups[r.product] = [];
    groups[r.product].push(r);
  });

  const productList = ['formula-rms','abhyas','mukhi','formula-signage'];

  el.innerHTML = `
    <div class="pane-header">
      <div>
        <div class="pane-title">Release Scorecards</div>
        <div class="pane-sub">Scope · Dev · QA · UAT · Readiness · Gates · Features · Scope changes</div>
      </div>
    </div>
    <div class="pane-lead">
      Per-release scorecards for all planned releases through FY 83/84. Weighted scope % + separate readiness dimensions. Click any card to open the full scorecard with feature list, gates, and scope changes.
    </div>

    <div class="ms-filters" style="align-items:center">
      <div class="ms-filter ${releasesFilter==='all'?'active':''}" onclick="releasesFilter='all';renderReleases()">All products</div>
      ${productList.map(pid => {
        const p = PRODUCTS.find(pp=>pp.id===pid);
        if (!p) return '';
        return `<div class="ms-filter ${releasesFilter===pid?'active':''}" onclick="releasesFilter='${pid}';renderReleases()">${p.name}</div>`;
      }).join('')}
      <div style="flex:1"></div>
      <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${releasesShowTBD?'checked':''} onchange="releasesShowTBD=this.checked;renderReleases()">
        Show TBD/placeholder releases

function releaseCard(r) {
  const scope = computeScopePct(r);
  const dev = computeDevPct(r);

  const gates = computeGatesPct(r);
  const readiness = computeReadiness(r);
  const readClass = readinessHealth(readiness);
  const isTBD = r.status === 'tbd';
  const target = fmtDate(r.targetDate);
  const daysToTarget = daysFromToday(r.targetDate);
  const daysLabel = r.status === 'released'
    ? (r.actualDate ? 'Delivered ' + fmtDate(r.actualDate) : 'Released')
    : (daysToTarget < 0 ? Math.abs(daysToTarget)+'d overdue' : daysToTarget+'d to target');

  return `
    <div class="rcard ${isTBD?'tbd':''}" onclick="openReleaseDetail('${r.id}')">
      <div class="rcard-head">
        <div>
          <div class="rcard-name">${r.name}</div>

        <div><span class="k">${r.status==='released'?'Delivered':'Timeline'}</span><span class="v ${daysToTarget<0&&r.status!=='released'?'r-danger':''}">${daysLabel}</span></div>

        <div><span class="k">Bugs (P0)</span><span class="v ${r.criticalBugs>0?'r-danger':''}">${r.criticalBugs||0}</span></div>
      </div>
      ${isTBD ? `
        <div class="rcard-tbd-note">${r.healthNote||'Scope to be refined 2–3 weeks ahead.'}</div>
      ` : `
        <div class="rcard-bars">
          <div class="rbar"><div class="rbar-lab">Scope</div><div class="rbar-track"><div class="rbar-fill ${scopeHealth(scope)==='g'?'':scopeHealth(scope)}" style="width:${scope}%"></div></div><div class="rbar-val">${scope}%</div></div>

const HEALTH_LABEL = {g:'On track', a:'At risk', r:'Blocked', paused:'Paused', closed:'Closed'};
const HEALTH_PILL  = {g:'pill-g',   a:'pill-a',  r:'pill-r',  paused:'pill-gray', closed:'pill-gray'};
const HEALTH_DOT   = {g:'g',        a:'a',       r:'r',       paused:'',           closed:''};

const STATUS_PILL = {
  live:'pill-g',dev:'pill-b',trial:'pill-a',blocked:'pill-r',consulting:'pill-p',
  procurement:'pill-pink',testing:'pill-teal',support:'pill-gray',planning:'pill-a',
  sprint:'pill-pink',design:'pill-p',
};
const STATUS_LABEL = {
  live:'Live',dev:'In development',trial:'Trial / deployment',blocked:'Blocked',
  consulting:'Consulting',procurement:'Procurement',testing:'Testing',support:'Support',
  planning:'Planning',sprint:'Sprint',design:'Design',
};

function fmtNPR(n) {
  if (!n && n !== 0) return '—';
  if (n >= 10000000) return (n/10000000).toFixed(2) + ' Cr';
  if (n >= 100000)   return (n/100000).toFixed(2) + ' L';
  if (n >= 1000)     return (n/1000).toFixed(0) + 'k';
  return n.toFixed(0);
}
function fmtDate(str) {
  if (!str) return '—';
  const [y,m,d] = str.split('-').map(Number);
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return `${mo} ${d}, ${y}`;
}
function daysBetween(fromStr, toStr) {
  const a = new Date(fromStr), b = new Date(toStr);
  return Math.round((b - a) / 86400000);
}
function daysFromToday(dateStr) { return daysBetween(NAV_META.today, dateStr); }

function ownerPill(pid) {
  const p = PMAP[pid];
  if (!p) return '';
  return `<span class="opill" style="background:${p.color}18;color:${p.color};border:0.5px solid ${p.color}40">
    <span class="oa" style="background:${p.color}">${p.initials}</span>${p.name.split(' ')[0]}
  </span>`;
}
function healthBadge(h) {
  return `<span class="pill ${HEALTH_PILL[h]||'pill-gray'}">
    <span class="ind-dot ${HEALTH_DOT[h]||''}"></span>${HEALTH_LABEL[h]||h}
  </span>`;
}
function statusBadge(s) {
  return `<span class="pill ${STATUS_PILL[s]||'pill-gray'}">${STATUS_LABEL[s]||s}</span>`;
}
function progressBar(pct, health) {
  const cls = health === 'r' ? 'r' : health === 'a' ? 'a' : '';
  return `<div class="pbar"><div class="pbar-fill ${cls}" style="width:${pct}%"></div></div>`;
}

function utilClass(v) {
  if (v > 1.001) return 'util-over';
  if (v >= 0.9)  return 'util-full';
  if (v >= 0.5)  return 'util-good';
  if (v > 0)     return 'util-under';
  return 'dim';
}

function renderHR_Capacity() {
  const sub = document.getElementById('sub-capacity');
  const utils = utilByPerson();
  const activePeople = PEOPLE.filter(p => utils[p.id] && utils[p.id].some(v => v > 0));
  sub.innerHTML = `
    <div class="pane-lead" style="margin:0 0 12px">
      Utilization check per person per Nepali month. Green = 50–89%, Yellow = 90–100%, Red = &gt;100% (over-allocated). Grey = &lt;50% (under-utilised).
    </div>
    <div style="overflow:auto;max-width:100%;max-height:calc(100vh - 340px);border-radius:8px;border:1px solid var(--border2)">
    <table class="hr-grid" style="border:none">
      <thead>
        <tr>
          <th class="person-h">Person</th>
          ${NEPALI_MONTHS.map(m => `<th>${m.label}<br><span class="small muted" style="font-weight:400">${m.greg}</span></th>`).join('')}
          <th>Avg</th>
        </tr>
      </thead>
      <tbody>
        ${activePeople.map(p => {

    </div>
  `;

function renderHR_Cost() {
  const sub = document.getElementById('sub-cost');
  // Cost per project per month
  const projectCosts = {};
  PRODUCTS.forEach(p => { projectCosts[p.id] = projectMonthlyCost(p.id); });
  Object.keys(SPECIAL_PROJECTS).forEach(k => { projectCosts[k] = projectMonthlyCost(k); });

  const grandMonthly = new Array(NMLEN).fill(0);
  Object.values(projectCosts).forEach(pc => pc.monthly.forEach((m,i)=>{grandMonthly[i]+=m}));
  const grandAnnual = grandMonthly.reduce((a,b)=>a+b,0);

  sub.innerHTML = `
    <div class="pane-lead" style="margin:0 0 12px">

        </tr>
      </tbody>
    </table>
    </div>
  `;
}

function renderHR_Idle() {
  const sub = document.getElementById('sub-idle');
  const utils = utilByPerson();
  const idleRows = PEOPLE
    .filter(p => !p.external && !p.planned && p.ctc > 0)
    .map(p => {
      const u = utils[p.id] || new Array(NMLEN).fill(0);
      const avg = u.reduce((a,b)=>a+b,0)/12;
      const idlePct = Math.max(0, 1 - avg);
      const idleCostAnnual = idlePct * p.ctc * 12;
      return {p, u, avg, idlePct, idleCostAnnual};
    })
    .sort((a,b) => b.idleCostAnnual - a.idleCostAnnual);

  const totalIdle = idleRows.reduce((s,r) => s + r.idleCostAnnual, 0);

  sub.innerHTML = `
    <div class="pane-lead" style="margin:0 0 12px">
      Paid capacity not allocated to any project. Total idle cost across the current team: <b>NPR ${fmtNPR(totalIdle)}/year</b>. This is not a leak by itself — some slack is healthy — but rows above ~25% idle deserve a look.
    </div>
    <table class="data-table">
      <thead>
        <tr><th>Person</th><th>Role</th><th class="right">Avg Util</th><th class="right">Idle %</th><th class="right">Annual CTC</th><th class="right">Annual Idle Cost</th></tr>

      <tbody>

            <td class="num muted">${fmtNPR(r.p.ctc*12)}</td>
            <td class="num strong">${fmtNPR(r.idleCostAnnual)}</td>

          <td colspan="5" class="right">Total idle cost:</td>
          <td class="num">${fmtNPR(totalIdle)}</td>
        </tr>
      </tbody>
    </table>
  `;
}

/* ═══════════════════════════════════════════════════════════════════

const TABS = [
  {id:'overview',   label:'Overview',    render: renderOverview},
  {id:'portfolio',  label:'Portfolio',   render: renderPortfolio},
  {id:'roadmap',    label:'Roadmap',     render: () => {} /* rendered inline; global build() runs at script load */},
  {id:'releases',   label:'Releases',    render: renderReleases},
  {id:'milestones', label:'Milestones',  render: renderMilestones},
  {id:'decisions',  label:'Decisions',   render: renderDecisions},
  {id:'hr',         label:'HR',          render: renderHR},
];

function buildTabNav() {
  const el = document.getElementById('tabnav');
  el.innerHTML = TABS.map(t => `
    <div class="tab ${t.id==='overview'?'active':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</div>
  `).join('');
}

function switchTab(id) {
  TABS.forEach(t => {
    document.querySelector(`.tab[data-tab="${t.id}"]`)?.classList.toggle('active', t.id === id);
    document.getElementById('pane-'+t.id).classList.toggle('active', t.id === id);
  });
  const tab = TABS.find(t => t.id === id);
  if (tab && tab.render) tab.render();

function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' ')}

function ownerPills(ids){
  return ids.map(id=>{
    const m=TMEM[id];if(!m)return'';
    return`<span class="opill" style="background:${m.color}18;color:${m.color};border:0.5px solid ${m.color}40"><span class="oa" style="background:${m.color}">${m.initials}</span>${m.name}</span>`;
  }).join('');
}

function build(){
  const tw=TW();
  const g=document.getElementById('gantt');
  let h='';

  h+=`<div class="gantt-hrow">`;
  h+=`<div class="hcorner">Track</div>`;
  h+=`<div class="htimeline" style="width:${tw}px;position:sticky">`;
  const todayOff=((new Date())-TS)/864e5;
  const todayPx=(todayOff/TDAYS*NCOLS*CW).toFixed(1);
  h+=`<div class="today-header-marker" style="left:${todayPx}px"><div class="today-badge">TODAY</div><div class="today-tick"></div></div>`;
  h+=`<div class="hcols">`;
  for(let i=0;i<NCOLS;i++){
    const maj=isMajor(i);const cd=colDate(i);
    h+=`<div class="hcol${maj?' major month-line':''}" style="flex:0 0 ${CW}px;width:${CW}px">${maj?cd.mo+' '+cd.d:''}</div>`;
  }
  h+=`</div></div></div>`;

  for(const grp of GROUPS){
    h+=`<div class="grow" data-gid="${grp.id}" onclick="toggleGroup('${grp.id}')">`;
    h+=`<div class="lc"><div class="glabel"><span class="garr" id="arr-${grp.id}">▾</span>${grp.label}</div></div>`;
    h+=`<div class="tc" style="width:${tw}px;min-width:${tw}px">`;
    for(let i=1;i<NCOLS;i++)if(isMajor(i))h+=`<div class="mline" style="left:${i*CW}px"></div>`;
    h+=`</div></div>`;

    for(const row of grp.rows){
      const h_=rh(row);
      const rowStatuses=[...new Set(row.tracks.flat().map(b=>b.st).filter(Boolean))];
      const rowOwners=[...new Set(row.tracks.flat().flatMap(b=>b.owners||[]))];
      const curLen=row.tracks.length;
      const baseH = Math.max(54, VP*2 + curLen*TH + (curLen-1)*TG);
      h+=`<div class="drow" data-group="${grp.id}" data-tag="${grp.tag}" data-statuses="${rowStatuses.join(',')}" data-owners="${rowOwners.join(',')}" data-base-h="${baseH}" data-full-h="${h_}" style="height:${h_}px">`;
      h+=`<div class="lc" style="height:${h_}px"><div class="row-title">${row.title}</div><div class="row-sub">${row.sub||''}</div><div class="owner-pills">${ownerPills(rowOwners)}</div></div>`;
      h+=`<div class="tc" style="width:${tw}px;min-width:${tw}px;height:${h_}px">`;
      h+=`<div class="today-line" style="left:${todayPx}px"></div>`;
      for(let i=1;i<NCOLS;i++)if(isMajor(i))h+=`<div class="mline" style="left:${i*CW}px"></div>`;

      const planLen=(row.planned&&row.planned.length)?row.planned.length:0;
      const PH=18, PG=3;
      const planStackHeight = planLen>0 ? (planLen*PH + (planLen-1)*PG + 6) : 0;

      // Draw PLANNED bars first (top of the row), each with a data-plan-shift attr for shifting current bars
      if(planLen>0){
        (row.planned||[]).forEach((segs,ti)=>{
          const top=VP+ti*(PH+PG);
          segs.forEach(bar=>{
            const pivotText = bar.pivot || 'Planned scope — see current bar below.';
            const rowPivotNote = row.pivotReason ? '<br><br><b>Why we pivoted:</b> ' + row.pivotReason : '';
            const fullTip = pivotText + rowPivotNote;
            const tip=`showTip(event,'${esc(fullTip)}','⚠️ PLANNED: ${esc(bar.label)}','${(bar.owners||[]).map(id=>TMEM[id]?.name||id).join(', ')}','${bar.st||''}','${fmtDate(bar.s)} → ${fmtDate(bar.e)} (was planned)')`;
            h+=`<div class="bar planned" data-planned="1" data-st="${bar.st||''}" style="left:${px(bar.s)};width:${pw(bar.s,bar.e)};top:${top}px;background:${bar.color}" onmouseenter="${tip}" onmouseleave="hideTip()">${esc(bar.label)}</div>`;
          });
        });
      }

      // Draw CURRENT bars below planned stack — store shift amount as data attr for toggle
      row.tracks.forEach((segs,ti)=>{
        const top=VP+planStackHeight+ti*(TH+TG);
        segs.forEach(bar=>{
          const oa=(bar.owners||[]).join(',');
          const tip=`showTip(event,'${esc(bar.tip)}','${esc(bar.label)}','${(bar.owners||[]).map(id=>TMEM[id]?.name||id).join(', ')}','${bar.st||''}','${fmtDate(bar.s)} → ${fmtDate(bar.e)}')`;
          const baseTop = VP + ti*(TH+TG);
          if(bar.dashed){
            h+=`<div class="bar dashed current-bar" data-owners="${oa}" data-st="${bar.st||''}" data-base-top="${baseTop}" data-full-top="${top}" style="left:${px(bar.s)};width:${pw(bar.s,bar.e)};top:${top}px;border-color:${bar.color};color:${bar.color}" onmouseenter="${tip}" onmouseleave="hideTip()">${esc(bar.label)}</div>`;
          }else{
            h+=`<div class="bar current-bar" data-owners="${oa}" data-st="${bar.st||''}" data-base-top="${baseTop}" data-full-top="${top}" style="left:${px(bar.s)};width:${pw(bar.s,bar.e)};top:${top}px;background:${bar.color}" onmouseenter="${tip}" onmouseleave="hideTip()">${esc(bar.label)}</div>`;
          }
        });
      });

      (row.ms||[]).forEach(ms=>{
        const tip=`showTip(event,'${esc(ms.tip)}','${esc(ms.label)}','','milestone','${fmtDate(ms.d)}')`;
        h+=`<div class="ms" style="left:calc(${px(ms.d)} - 6px);top:50%;background:${ms.color}" onmouseenter="${tip}" onmouseleave="hideTip()"></div>`;
      });

      h+=`</div></div>`;
    }
  }
  g.innerHTML=h;
}

let activeStatuses=new Set(),activeTrackTag='all',activePeople=new Set();

function buildStatusChips(){
  const row=document.getElementById('statusRow');
  let h='';
  ALL_STATUSES.forEach(st=>{
    const b=BADGE[st];
    h+=`<button class="chip" onclick="toggleStatus('${st}',this)">${b[2]}</button>`;
  });
  row.innerHTML=`<div class="filter-label">Status</div>`+h;
}
function toggleStatus(st,btn){
  if(activeStatuses.has(st)){activeStatuses.delete(st);btn.classList.remove('active')}
  else{activeStatuses.add(st);btn.classList.add('active')}
  applyFilters();
}
function buildPeopleChips(){
  const row=document.getElementById('peopleRow');
  let h='';
  TEAM.forEach(m=>{
    h+=`<button class="pchip" id="pc-${m.id}" onclick="togglePerson('${m.id}',this)"><span class="avatar" style="background:${m.color}">${m.initials}</span>${m.name}</button>`;
  });
  row.innerHTML=`<div class="filter-label">People</div>`+h;
}
function togglePerson(id,btn){
  if(activePeople.has(id)){activePeople.delete(id);btn.classList.remove('active')}
  else{activePeople.add(id);btn.classList.add('active')}
  applyFilters();applyEngage();
}
function trackFilter(tag,btn){
  document.querySelectorAll('.filterbar .filter-row:first-child .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeTrackTag=tag;applyFilters();
}
function applyFilters(){
  document.querySelectorAll('.drow').forEach(el=>{
    const tag=el.dataset.tag||'';
    const sts=(el.dataset.statuses||'').split(',').filter(Boolean);
    const own=(el.dataset.owners||'').split(',').filter(Boolean);
    let show=true;
    if(activeTrackTag!=='all'&&tag!==activeTrackTag)show=false;
    if(activeStatuses.size>0&&!sts.some(s=>activeStatuses.has(s)))show=false;
    if(activePeople.size>0&&!own.some(o=>activePeople.has(o)))show=false;
    el.classList.toggle('hidden',!show);
  });
  document.querySelectorAll('.grow').forEach(el=>{
    const gid=el.dataset.gid;
    const grp=GROUPS.find(g=>g.id===gid);
    if(!grp)return;
    el.classList.toggle('hidden',activeTrackTag!=='all'&&grp.tag!==activeTrackTag);
  });
}
function applyEngage(){
  const has=activePeople.size>0;
  document.querySelectorAll('.bar').forEach(b=>{
    const own=(b.dataset.owners||'').split(',').filter(Boolean);
    if(!has){b.classList.remove('dimmed','highlighted');return}
    const m=own.some(o=>activePeople.has(o));
    b.classList.toggle('dimmed',!m);b.classList.toggle('highlighted',m);
  });
  document.querySelectorAll('.ms').forEach(m=>m.classList.toggle('dimmed',has));
}

function fmtDate(s){
  if(!s)return'';
  const[y,m,d]=s.split('-').map(Number);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return`${mo} ${d}, ${y}`;
}
function showTip(e,body,title,owner,status,dateRange){
  const t=document.getElementById('tt');
  const b=BADGE[status]||BADGE.milestone;
  let inner=`<div class="ttt">${title}</div>`;
  if(b)inner+=`<span class="ttbadge" style="background:${b[0]};color:${b[1]}">${b[2]}</span><br>`;
  if(dateRange)inner+=`<div style="font-size:10px;color:#333;font-weight:600;margin-top:4px">📅 ${dateRange}</div>`;
  inner+=`<div class="ttb" style="margin-top:3px">${body}</div>`;
  if(owner)inner+=`<div class="ttown">👤 ${owner}</div>`;
  t.innerHTML=inner;t.classList.add('show');posT(e);
}
function hideTip(){document.getElementById('tt').classList.remove('show')}
function posT(e){
  const t=document.getElementById('tt');
  let x=e.clientX+14,y=e.clientY+14;
  if(x+290>window.innerWidth)x=e.clientX-302;
  if(y+250>window.innerHeight)y=e.clientY-250;
  t.style.left=x+'px';t.style.top=y+'px';
}
document.addEventListener('mousemove',e=>{if(document.getElementById('tt').classList.contains('show'))posT(e)});

const collapsed={};
function toggleGroup(id){
  collapsed[id]=!collapsed[id];
  document.querySelectorAll(`[data-group="${id}"]`).forEach(el=>el.classList.toggle('hidden',collapsed[id]));
  const arr=document.getElementById('arr-'+id);
  if(arr)arr.style.transform=collapsed[id]?'rotate(-90deg)':'';
}
function expandAll(){
  GROUPS.forEach(g=>{
    collapsed[g.id]=false;
    document.querySelectorAll(`[data-group="${g.id}"]`).forEach(el=>el.classList.remove('hidden'));
    const arr=document.getElementById('arr-'+g.id);
    if(arr)arr.style.transform='';
  });
}

// ── PLANNED-VS-CURRENT TOGGLE ──
let showingPlanned = true; // default: show planned bars so pivots are visible on load
function applyPlannedVisibility(){
  document.querySelectorAll('.drow').forEach(row=>{
    row.classList.toggle('planned-row-hidden', !showingPlanned);
    const baseH = row.dataset.baseH;
    const fullH = row.dataset.fullH;
    const targetH = showingPlanned ? fullH : baseH;
    row.style.height = targetH + 'px';
    const lc = row.querySelector('.lc'); if(lc) lc.style.height = targetH + 'px';
    const tc = row.querySelector('.tc'); if(tc) tc.style.height = targetH + 'px';
    // Move current bars up when planned is hidden
    row.querySelectorAll('.current-bar').forEach(b=>{
      const top = showingPlanned ? b.dataset.fullTop : b.dataset.baseTop;
      b.style.top = top + 'px';
    });
  });
}
function togglePlanned(btn){
  showingPlanned = !showingPlanned;
  btn.innerHTML = showingPlanned ? '👁 Hide planned' : '👁 Show planned';
  btn.style.background = showingPlanned ? '#FFF9E6' : '';
  btn.style.borderColor = showingPlanned ? '#E6C300' : '';
  btn.style.color = showingPlanned ? '#7A5200' : '';
  applyPlannedVisibility();
}

build();buildStatusChips();buildPeopleChips();
applyPlannedVisibility();
